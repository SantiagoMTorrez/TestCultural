<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Categoría</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <!-- Título -->
    <h1 class="text-center mb-4">Nueva Categoría</h1>
    
    <!-- Formulario -->
    <form>
      <!-- Campo Categoría -->
      <div class="mb-3">
        <label for="categoria" class="form-label">Categoría</label>
        <input type="text" class="form-control" id="categoria" placeholder="Nombre de la categoría">
      </div>
      
      <!-- Campo Descripción -->
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" rows="3" placeholder="Descripción de la categoría"></textarea>
      </div>
      
      <!-- Botón de enviar -->
      <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
  </div>

  <!-- Bootstrap JS (Opcional, solo si usas componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
