
<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let tok=""
        async function login () {
            const response = await fetch("http://localhost:8080/user/login/",{headers:{"Content-Type":"application/json"},method:"POST",body:JSON.stringify({
                "email": "admin@example.com","password": "admin"})})
            const data = await response.json()
            console.log(
                data.token
                
            );
        tok=data.token 
        }

        async function logout () {
            const response = await fetch("http://localhost:8080/user/logout/",{headers:{"Content-Type":"application/json","Authorization":"Token "+ tok},method:"POST"})
                
            const code = await response.status
            console.log(
                code
            );
                
        }
        
        async function loginexe (){
            await login()
            await logout()
        }
        
        loginexe()

    </script>

</body>
</html>
